psjd: '2.0'
id: Analysis-ADVC-Structure
title: Analysis.ADVC.Structure()
domain: psj-command
group: ADVC
namespace: Analysis.ADVC
ribbon: Analysis > ADVC > Structure
description: Run the ADVC Structure analysis.
version_introduced: '5.0.0'
params:
    - $group: advc-process-struct
    - name: iEJobType
      type: Integer
      required: false
      default: '0'
      description: Job type.
      enum_values:
          - id: 0
            label: Structure
    - name: iHeatConvection
      type: Integer
      required: false
      default: '1'
      description: Heat convection mode.
returns:
    kind: typed
    type: Cursor
    description: The created ADVC analysis job.
changes:
    - version: '5.0.1'
      params:
          remove:
              - iEJobType
              - iHeatConvection
      notes: 'Removed iEJobType and iHeatConvection; both are no longer available.'
    - version: '5.1.0'
      params:
          add:
              - name: bNewFeature
                type: Boolean
                required: false
                default: 'False'
                description: New feature flag added in 5.1.0.
                after: iGeomNonlinear
      item:
          description: Run the ADVC Structure analysis (updated for 5.1.0).
