psjd: '2.0'
kind: param_group
id: advc-process-base
description: Core parameters shared by all ADVC process commands.
params:
    - name: strName
      type: String
      required: true
      default: ~
      description: Process name.
    - name: crEdit
      type: Cursor
      required: false
      default: 'None'
      description: Existing process to modify. None creates a new process.
    - name: listLoadNode
      type: 'List[$ref:data-type/JPT_ADVC_LOAD_NODE]'
      required: false
      default: '[]'
      description: Nodes with assigned loads.
    - name: ilOutputParamList
      type: List[Integer]
      required: false
      default: '[]'
      description: Output request list.
    - name: iRefType
      type: Integer
      required: false
      default: '0'
      description: Reference result type.
      enum_values:
          - id: 0
            label: Temperature Load
          - id: 1
            label: Stress
