jcall: '2.0'
kind: param_group
id: nastran-base
description: Common parameters shared by all Nastran analysis export commands.

params:
    - name: strName
      type: String
      required: false
      default: '"Job_1"'
      description: Job name for the Nastran analysis.

    - name: strPath
      type: String
      required: true
      default: ~
      description: Export path for the BDF file.

    - name: crEdit
      type: Cursor
      required: false
      default: 'None'
      description: Existing Nastran job to modify. None creates a new job.
