psjapi: '1.0'
id: AdvcStaticProcess
title: AdvcStaticProcess()
domain: macro
group: analysis
description: >
    Low-level macro to create or modify an ADVC static structural analysis process.
    Called internally by Analysis.ADVC.MakeProcess.Static(). Can be used directly
    via JPT.Exec() for scripting at the macro level.
version_introduced: '5.0.0'
command_link: Analysis-ADVC-MakeProcess-Static

syntax: >
    AdvcStaticProcess(string m_strName, int m_iGeomNonlinear, int fixed_or_auto,
      int num_of_inc, double max_time, double max_dt, double min_dt, int load_type,
      int output_last, int output_interval, int restart_last, int restart_interval,
      double output_time_interval, double restart_time_interval,
      bool m_bConvergence, ...)

callouts:
    - level: warn
      text: >
          Prefer Analysis.ADVC.MakeProcess.Static() for scripting. This macro
          exposes all raw positional arguments and requires exact positional
          ordering — passing the wrong value at a position causes silent errors.
    - level: info
      text: >
          Positions 9–14 (output/restart intervals) and 16–29 (convergence block),
          31–42 (contact block), 44–63 (auto-increment block) are documented in the
          full macro reference. Only the most commonly used positions are shown here.

params:
    - position: 1
      name: m_strName
      type: String
      required: true
      description: Name of the ADVC static process.

    - position: 2
      name: m_iGeomNonlinear
      type: Integer
      required: true
      description: Geometry nonlinearity mode.
      enum_values:
          - id: 0
            label: '(blank) — linear'
          - id: 1
            label: Total Lagrange
          - id: 2
            label: Updated Lagrange
      deprecated: true
      deprecated_in: '5.0.1'

    - position: 3
      name: fixed_or_auto
      type: Integer
      required: true
      description: Time step control mode.
      enum_values:
          - id: 0
            label: Auto
          - id: 1
            label: Fixed
      removed_in: '5.1.0'

    - position: 4
      name: num_of_inc
      type: Integer
      required: true
      description: Number of increments.

    - position: 5
      name: max_time
      type: Double
      required: true
      description: Maximum analysis time.

    - position: 6
      name: max_dt
      type: Double
      required: true
      description: Maximum time step size.

    - position: 7
      name: min_dt
      type: Double
      required: true
      description: Minimum time step size.

    - position: 8
      name: load_type
      type: Integer
      required: true
      description: Load application type.
      enum_values:
          - id: -1
            label: Default
          - id: 0
            label: Step
          - id: 1
            label: Ramp

    - position: 15
      name: m_bConvergence
      type: Boolean
      required: true
      description: Whether convergence parameters are defined.

    - position: 30
      name: m_bContact
      type: Boolean
      required: true
      description: Whether contact iterator parameters are defined.

    - position: 43
      name: m_bAutoIncrement
      type: Boolean
      required: true
      description: Whether auto increment parameters are defined.

    - position: 64
      name: m_crEdit
      type: Cursor
      required: true
      description: Edit cursor for an existing process. Use 0:0 for a new process.

    - position: 65
      name: m_LoadNodeList
      type: List
      required: true
      description: Load node assignment list.

    - position: 66
      name: m_LoadCaseNodeList
      type: List
      required: true
      description: Load case node assignment list.

    - position: 67
      name: m_LoadNodeContactList
      type: List
      required: true
      description: Contact node assignment list.

    - position: 68
      name: m_OutputParamList
      type: List
      required: true
      description: Output parameter list.

    - position: 69
      name: m_iRefType
      type: Integer
      required: true
      description: Reference result type.
      enum_values:
          - id: 0
            label: Temperature Load
          - id: 1
            label: Stress

    - position: 70
      name: m_strRefPath
      type: String
      required: true
      description: Path of reference result file.

    - position: 71
      name: m_ReferenceResultList
      type: List
      required: true
      description: Reference result data list.

returns:
    kind: macro_code
    codes:
        - value: '"1"'
          meaning: The function executed successfully.
        - value: '"0"'
          meaning: The function could not be executed.

examples:
    - title: Minimal static process via JPT.Exec
      language: psj
      code: |
          JPT.Exec('AdvcStaticProcess("ADVC_DEFAULT_PROCESS", 0, 0, 1, 1, 1, 1e-05,
            -1, -1, 2147483647, -1, 2147483647, 1.79769e+308, 1.79769e+308,
            0, 1.79769e+308, 1.79769e+308, 1.79769e+308, 1.79769e+308,
            1.79769e+308, 1.79769e+308, 1.79769e+308, 1.79769e+308, 1.79769e+308,
            1.79769e+308, 1.79769e+308, 2147483647, 2147483647, 1.79769e+308,
            0, -1, 2147483647, 2147483647, 1.79769e+308, 1.79769e+308,
            1.79769e+308, 1.79769e+308, 2147483647, 0, 1.79769e+308, 1.79769e+308,
            0, 0, 2147483647, 2147483647, 2147483647, 1.79769e+308, 1.79769e+308,
            1.79769e+308, 2147483647, 2147483647, 1.79769e+308, 1.79769e+308,
            1.79769e+308, 1.79769e+308, 1.79769e+308, 0, 1.79769e+308,
            1.79769e+308, 1.79769e+308, 1.79769e+308, 1.79769e+308, 0:0,
            [(29:1, 0:0, 1), (29:2, 0:0, 1)], [], [], [], -1, "", [], "", 2147483647)')

    - title: Check return code
      language: python
      code: |
          result = JPT.Exec(
              'AdvcStaticProcess("MyProcess", 1, 1, 10, 1.0, 0.1, 1e-5, '
              '-1, -1, 2147483647, -1, 2147483647, 1.79769e+308, 1.79769e+308,'
              '0, ..., 0:0, [], [], [], [], -1, "", [], "", 2147483647)'
          )
          if result == "1":
              print("Process created successfully.")
          else:
              print("Failed to create process.")

see_also:
    - $ref: psj-command/Analysis-ADVC-MakeProcess-Static
      label: Analysis.ADVC.MakeProcess.Static()
