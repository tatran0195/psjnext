psjapi: '2.0'
kind: sidecar
id: AdvcStaticProcess
locale: ja
title: AdvcStaticProcess()
description: ADVC 静解析プロセスを作成します。
params:
    - name: m_strName
      description: ADVC 静解析プロセス名。
    - name: m_iGeomNonlinear
      description: 幾何学的非線形モード。
      enum_values:
          - id: 0
            label: （空白）
          - id: 1
            label: トータルラグランジュ
          - id: 2
            label: 更新ラグランジュ
    - name: fixed_or_auto
      description: 時間ステップ制御。
      enum_values:
          - id: 0
            label: 自動
          - id: 1
            label: 固定
    - name: num_of_inc
      description: 増分数。
    - name: max_time
      description: 最大時間。
returns:
    codes:
        - value: '"1"'
          meaning: 関数を実行できます。
        - value: '"0"'
          meaning: 関数を実行できません。
