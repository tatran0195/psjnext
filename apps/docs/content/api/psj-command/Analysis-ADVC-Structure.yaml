jcall: '2.0'
id: Analysis-ADVC-Structure
title: Analysis.ADVC.Structure()
domain: psj-command
group: ADVC
namespace: Analysis.ADVC
description: Run ADVC Structure analysis.
version_introduced: '5.0.0'

params:
    - name: strName
      type: String
      required: true
      default: ~
      description: Analysis name.

    - name: iEJobType
      type: Integer
      required: false
      default: '0'
      description: Job type.
      enum_values:
          - id: 0
            label: Structure

returns:
    kind: typed
    type: Cursor
    description: The created ADVC analysis job.

changes:
    - version: '5.0.1'
      params:
          remove:
              - iEJobType
      notes: 'Removed iEJobType; no longer available.'
